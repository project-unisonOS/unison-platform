name: reusable-build
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      domain:
        required: true
        type: string
      service_port:
        required: false
        type: string
        default: "8080"
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      context:
        required: false
        type: string
        default: "."

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.version.outputs.image }}
      version: ${{ steps.version.outputs.semver }}
      digest: ${{ steps.build.outputs.digest }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version and tags (channel aware)
        id: version
        run: |
          REF="${GITHUB_REF}"
          TODAY="$(date -u +%Y%m%d)"
          SHA="${GITHUB_SHA::7}"
          TAG_FILE="tags.txt"
          
          write_output() {
            echo "$1" >> "$GITHUB_OUTPUT"
          }

          if [[ "${REF}" == refs/tags/v* ]]; then
            # Stable release tag: vX.Y.Z
            VERSION="${REF#refs/tags/}"
            IFS='.' read -r MAJOR MINOR _PATCH <<< "${VERSION#v}"
            CHANNEL="stable"
            write_output "semver=${VERSION}"
            write_output "channel=${CHANNEL}"
            {
              echo "type=raw,value=${VERSION}"
              echo "type=raw,value=latest"
              echo "type=raw,value=v${MAJOR}.${MINOR}"
              echo "type=raw,value=v${MAJOR}"
              echo "type=raw,value=${SHA}"
            } > "${TAG_FILE}"
          elif [[ "${REF}" == refs/heads/release/* ]]; then
            # Release branch beta: release/x.y -> vX.Y.0-beta.<run>
            BASE="${REF#refs/heads/release/}"
            VERSION="v${BASE}.0-beta.${GITHUB_RUN_NUMBER}"
            CHANNEL="beta"
            write_output "semver=${VERSION}"
            write_output "channel=${CHANNEL}"
            {
              echo "type=raw,value=${VERSION}"
              echo "type=raw,value=${VERSION}-run${GITHUB_RUN_ATTEMPT}"
              echo "type=raw,value=${SHA}"
            } > "${TAG_FILE}"
          else
            # Default to nightly edge off main and other branches
            VERSION="edge-${GITHUB_REF_NAME:-main}-${TODAY}"
            CHANNEL="nightly"
            write_output "semver=${VERSION}"
            write_output "channel=${CHANNEL}"
            {
              echo "type=raw,value=${VERSION}"
              echo "type=sha,prefix=${GITHUB_REF_NAME:-main}-"
              echo "type=raw,value=${SHA}"
            } > "${TAG_FILE}"
          fi

          {
            echo "sha=${SHA}"
            echo "domain=${{ inputs.domain }}"
            OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
            echo "image_base=ghcr.io/${OWNER_LOWER}/${{ inputs.image_name }}"
            echo "image=ghcr.io/${OWNER_LOWER}/${{ inputs.image_name }}:${SHA}"
            echo "tags<<EOF"
            cat "${TAG_FILE}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.version.outputs.image_base }}
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ inputs.image_name }}
            org.opencontainers.image.description=Unison ${{ inputs.domain }} service
            org.opencontainers.image.version=${{ steps.version.outputs.semver }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            unison.domain=${{ inputs.domain }}
            unison.service=${{ inputs.image_name }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE_PORT=${{ inputs.service_port }}
            SERVICE_NAME=${{ inputs.image_name }}
            SERVICE_VERSION=${{ steps.version.outputs.semver }}

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # Node 24, Syft v1.42.3
        with:
          image: ${{ steps.version.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ inputs.image_name }}
          path: sbom.spdx.json

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.version.outputs.image_base }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: 'trivy-results.sarif'

  contract-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start service container
        run: |
          docker run -d --name service-under-test \
            -p ${{ inputs.service_port }}:${{ inputs.service_port }} \
            -e SERVICE_PORT=${{ inputs.service_port }} \
            ${{ needs.build.outputs.image }}

      - name: Wait for service to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:${{ inputs.service_port }}/health; do sleep 2; done'

      - name: Show service logs on readiness failure
        if: failure()
        run: docker logs service-under-test

      - name: Run contract tests
        run: |
          if [ -d "tests/contracts" ]; then
            python -m pytest tests/contracts/ -v
          else
            echo "No contract tests found, skipping..."
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f service-under-test 2>/dev/null || true

  qa-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect QA smoke assets
        id: qa_assets
        shell: bash
        run: |
          if [[ -f docker-compose.prod.yml ]] && [[ -d qa ]] && compgen -G "qa/**" > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start compose stack (prod)
        if: ${{ steps.qa_assets.outputs.run == 'true' }}
        run: |
          docker compose -f docker-compose.prod.yml up -d --wait

      - name: Run QA smoke
        if: ${{ steps.qa_assets.outputs.run == 'true' }}
        env:
          TARGET_HOST: http://localhost
        run: |
          python -m pytest qa -v --tb=short --color=yes

      - name: Logs on failure
        if: ${{ failure() && steps.qa_assets.outputs.run == 'true' }}
        run: docker compose -f docker-compose.prod.yml logs --tail=200

      - name: Teardown
        if: ${{ always() && steps.qa_assets.outputs.run == 'true' }}
        run: docker compose -f docker-compose.prod.yml down -v --remove-orphans
